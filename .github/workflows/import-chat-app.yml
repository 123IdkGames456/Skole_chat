name: Import Chat App 2 files

on:
  push:
    paths:
      - ".github/workflows/import-chat-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Skole_chat
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Chat App 2
        run: git clone --depth 1 https://github.com/123IdkGames456/chat-app2.git "$RUNNER_TEMP/chat-app2"

      - name: Copy every file
        run: |
          rsync -a --delete --exclude='/.git/' "$RUNNER_TEMP/chat-app2/" "$GITHUB_WORKSPACE/"
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import all Chat App 2 files"
            git push origin HEAD:main
          fi
